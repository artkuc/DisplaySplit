name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DisplaySplit.slnx -c Release

      - name: Unit tests
        shell: pwsh
        run: |
          $env:DISPLAYSPLIT_HOME = Join-Path $env:RUNNER_TEMP 'displaysplit-tests'
          dotnet test tests/DisplaySplit.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Publish (framework-dependent, single file)
        run: dotnet publish src/DisplaySplit -c Release -o out/framework-dependent

      - name: Publish (NativeAOT, self-contained)
        run: dotnet publish src/DisplaySplit -c Release -p:PublishAot=true -o out/aot

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: DisplaySplit-ci-${{ github.sha }}
          path: |
            out/aot/DisplaySplit.exe
            out/framework-dependent/DisplaySplit.exe
          retention-days: 14
